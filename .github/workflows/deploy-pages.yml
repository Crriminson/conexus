name: Deploy to GitHub Pages

on:
  push:
    branches: [updates/v1.1]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # VITE_SUPABASE_ANON_KEY is Supabase's publishable key, meant to be
      # public client-side (protected by RLS) — safe to bake into a static
      # build, unlike the service-role key.
      - run: npm run build -- --base=/conexus/
        env:
          VITE_SUPABASE_URL: https://fvtazfdppcajoglteutz.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_qasYv8qHZGh4yklIsffvDw_7jSLjrjq
          VITE_SUPABASE_STORAGE_BUCKET: documents
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
