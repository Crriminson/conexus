kind = "web"
previewPath = "/"
title = "Conexus - IPO Workflow Platform"
version = "1.0.0"
id = "artifacts/conexus"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24454

[services.development]
run = "pnpm --filter @workspace/conexus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/conexus", "run", "build" ]
serve = "static"
publicDir = "artifacts/conexus/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24454"
BASE_PATH = "/"
