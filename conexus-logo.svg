<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Conexus logo</title>
  <desc id="logoDesc">Conexus brand mark with a charging bull on ascending growth bars and the CONEXUS wordmark</desc>
  <defs>
    <linearGradient id="barGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17c0a9" />
      <stop offset="100%" stop-color="#0c3d72" />
    </linearGradient>
    <linearGradient id="xGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17c0a9" />
      <stop offset="100%" stop-color="#0c3d72" />
    </linearGradient>
