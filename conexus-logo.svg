      <stop offset="0%" stop-color="#17c0a9" />
      <stop offset="100%" stop-color="#0c3d72" />
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b1737" flood-opacity="0.16" />
    </filter>
  </defs>

